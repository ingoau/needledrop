name: needledrop

services:
  needledrop:
    build: .
    image: needledrop:latest
    container_name: needledrop
    restart: unless-stopped
    # ingowolf, plus the mediastack group that owns the music share (CIFS 0770)
    user: "${PUID:-1000}:${PGID:-1000}"
    group_add:
      - "${MEDIA_GID:-1002}"
    env_file:
      - path: .env
        required: false
    environment:
      BEETSDIR: ${BEETS_CONFIG_DIR:-/home/ingowolf/.config/beets}
      INBOX_DIR: ${INBOX_DIR:-/mnt/mediastackdata/music/rips/apple}
      DOWNLOADING_DIR: ${DOWNLOADING_DIR:-/mnt/mediastackdata/music/rips/.downloading}
      HISTORY_DB: ${HISTORY_DB:-/srv/scripts/music/download-history.sqlite3}
      WRAPPER_URL: http://wrapper:80
      WRAPPER_DECRYPT_HOST: wrapper
      WRAPPER_DECRYPT_PORT: "10020"
    volumes:
      - ./data:/data
      # Same paths as on the host: the beets config and library.db use
      # host-absolute paths, and downloading/inbox/library must share one
      # filesystem so moves are renames.
      - /mnt/mediastackdata/music:/mnt/mediastackdata/music
      - ${BEETS_CONFIG_DIR:-/home/ingowolf/.config/beets}:${BEETS_CONFIG_DIR:-/home/ingowolf/.config/beets}
      # Shared with the apple-music-to-rip timer so both skip what's already ripped.
      - ${HISTORY_DIR:-/srv/scripts/music}:${HISTORY_DIR:-/srv/scripts/music}
    labels:
      - traefik.enable=true
      - traefik.http.routers.needledrop.middlewares=notoverkill-sso@file
      - traefik.http.services.needledrop.loadbalancer.server.port=8080
    networks:
      - apps
      - wrapper

networks:
  apps:
    external: true
  wrapper:
    name: wrapper-v2_default
    external: true
