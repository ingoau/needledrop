name: needledrop

services:
  needledrop:
    build: .
    image: needledrop:latest
    container_name: needledrop
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file:
      - path: .env
        required: false
    environment:
      MUSIC_DIR: ${MUSIC_MOUNT:-/music}
    volumes:
      - ./data:/data
      # inbox/, .downloading/ and library/ live under here by default.
      - ${MUSIC_PATH:-./music}:${MUSIC_MOUNT:-/music}
      # beets config + library.db. A default config is written if empty.
      - ${BEETS_PATH:-./beets}:/config/beets
    ports:
      # No auth built in: keep it on localhost or behind an auth proxy.
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"
    networks:
      - default
      - wrapper

networks:
  wrapper:
    # The compose network of your wrapper-v2 stack.
    name: ${WRAPPER_NETWORK:-wrapper-v2_default}
    external: true
